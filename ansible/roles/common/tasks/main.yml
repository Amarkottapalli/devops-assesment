- name: Install base packages
  ansible.builtin.apt:
    name: [curl, git, docker.io]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create ansible_user
  ansible.builtin.user:
    name: ansible_user
    shell: /bin/bash
    password: "{{ ansible_user_password | password_hash('sha512', 'V7labsalt2026') }}"
    update_password: on_create

- name: Give ansible_user sudo through a dedicated sudoers.d file
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ansible_user
    content: "ansible_user ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Authorize the SSH key for ansible_user
  ansible.posix.authorized_key:
    user: ansible_user
    key: "{{ lookup('file', ssh_public_key_file) }}"
    state: present
